name: Release

# 推送 v* tag 自动发布 GitHub Release：git tag v1.0.0 && git push origin v1.0.0
# 手动运行（Actions 页 Run workflow）只打包并上传为 Actions 产物，不创建 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Build & package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            mcp/pnpm-lock.yaml

      - name: Backend tests
        run: dotnet test HZone.sln -c Release

      # 框架依赖发布：目标机装 .NET 8 运行时后 `dotnet HZone.Api.dll` 启动
      - name: Publish API
        run: dotnet publish src/HZone.Api/HZone.Api.csproj -c Release -o out/hzone-api

      - name: Build H5
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:h5

      - name: Build MCP server
        working-directory: mcp
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p release
          (cd out && zip -qr "../release/hzone-api-${version}.zip" hzone-api)
          (cd frontend/dist/build && zip -qr "../../../release/hzone-h5-${version}.zip" h5)
          (cd mcp && zip -qr "../release/hzone-mcp-${version}.zip" dist package.json pnpm-lock.yaml README.md)
          ls -lh release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: hzone-release
          path: release/*.zip
          retention-days: 14
