<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>draw.io</title>
  <link rel="stylesheet" href="./drawio_lib/grapheditor.css">
</head>

<!-- geEditor 是 draw.io grapheditor 需要的 class（照抄 cherry 官方 examples/drawio_demo.html，
     静态资源来自 cherry-markdown 仓库 examples/assets/{drawio_lib,mxgraph}，路径改写为本目录相对路径） -->
<body class="geEditor">
  <script type="text/javascript">
    window.EXPORT_URL = window.EXPORT_URL || './drawio_lib';
    window.SAVE_URL = window.SAVE_URL || './drawio_lib';
    window.OPEN_URL = window.OPEN_URL || './drawio_lib';
    window.RESOURCES_PATH = window.RESOURCES_PATH || './drawio_lib/resources';
    window.STENCIL_PATH = window.STENCIL_PATH || './drawio_lib/image/stencils';
    window.IMAGE_PATH = window.IMAGE_PATH || './drawio_lib/image';
    window.STYLE_PATH = window.STYLE_PATH || './drawio_lib/src/css';
    window.CSS_PATH = window.CSS_PATH || './drawio_lib/src/css';
    window.OPEN_FORM = window.OPEN_FORM || './drawio_lib';
    window.mxBasePath = window.mxBasePath || './drawio_lib/src';
    window.mxLanguage = window.mxLanguage || 'zh';
    window.mxLanguages = window.mxLanguages || ['zh'];
  </script>
  <!-- 加载 draw.io 需要的静态资源 begin -->
  <script type="text/javascript" src="./drawio_lib/Init.js"></script>
  <script type="text/javascript" src="./drawio_lib/lib/pako.min.js"></script>
  <script type="text/javascript" src="./drawio_lib/lib/base64.js"></script>
  <script type="text/javascript" src="./drawio_lib/jscolor/jscolor.js"></script>
  <script type="text/javascript" src="./drawio_lib/lib/purify.min.js"></script>
  <script type="text/javascript" src="./mxgraph/mxClient.js"></script>
  <script type="text/javascript" src="./drawio_lib/Editor.js"></script>
  <script type="text/javascript" src="./drawio_lib/EditorUi.js"></script>
  <script type="text/javascript" src="./drawio_lib/Sidebar.js"></script>
  <script type="text/javascript" src="./drawio_lib/Graph.js"></script>
  <script type="text/javascript" src="./drawio_lib/Format.js"></script>
  <script type="text/javascript" src="./drawio_lib/Shapes.js"></script>
  <script type="text/javascript" src="./drawio_lib/Actions.js"></script>
  <script type="text/javascript" src="./drawio_lib/Menus.js"></script>
  <script type="text/javascript" src="./drawio_lib/Toolbar.js"></script>
  <script type="text/javascript" src="./drawio_lib/Dialogs.js"></script>
  <!-- 加载 draw.io 需要的静态资源 end -->

  <script src="./drawio-bridge.js"></script>
</body>

</html>
